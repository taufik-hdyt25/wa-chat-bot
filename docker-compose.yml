version: '3.8'

services:
  wa-bot:
    build: 
      context: ./whatsapp-bot
    container_name: wa-bot
    restart: unless-stopped
    tty: true # Agar QR Code bisa dirender di log docker
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      # Mount folder prisma agar DB persisten & tersinkronisasi
      - ./whatsapp-bot/prisma:/app/prisma
      # Mount session WA agar tidak perlu scan ulang setiap direstart
      - ./whatsapp-bot/auth_info_baileys:/app/auth_info_baileys
    env_file:
      - ./whatsapp-bot/.env
    environment:
      # Paksa Prisma membaca DB dari file mount
      - DATABASE_URL=file:///app/prisma/dev.db

  wa-dashboard:
    build: 
      context: ./chat-dashboard
    container_name: wa-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3333:3000" # Diubah ke port 3333 karena 3000 sudah terpakai
    volumes:
      # Mount folder prisma dari whatsapp-bot ke dashboard agar datanya 100% sama!
      - ./whatsapp-bot/prisma:/app/prisma
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:///app/prisma/dev.db
      - DASHBOARD_USER=${DASHBOARD_USER}
      - DASHBOARD_PASS=${DASHBOARD_PASS}
      - BOT_API_URL=http://wa-bot:3001
