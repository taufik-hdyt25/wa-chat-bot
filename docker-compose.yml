version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: whatsapp_bot_db
    environment:
      POSTGRES_USER: thbot
      POSTGRES_PASSWORD: thbot2599
      POSTGRES_DB: whatsapp_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
